id: android-16-redroid
name: Android 16 (redroid)
description: Android in a container via redroid (needs the binder kernel module on the node). Screen via scrcpy over ADB.
version: "1"
family: android
icon: android
guest_profile: android
readiness: adb
default_user: shell
supported_services: [adb]
min_resources: { vcpus: 2, ram_mb: 2048, storage_gb: 8 }
default_resources: { vcpus: 4, ram_mb: 4096, storage_gb: 16 }
license: false
arch: [arm64, x86_64]
images:
  android:
    url: docker://redroid/redroid:16.0.0_64only-latest
    format: container
params:
  backend: redroid
  api_level: "36"
  width: "1080"
  height: "1920"
  dpi: "420"
