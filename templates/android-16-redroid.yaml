id: android-16-redroid
name: Android 16 (redroid)
description: Android in a container via redroid. Needs binder AND the ashmem kernel driver on the node (ashmem was removed in Linux 5.18, so most current kernels lack it; use Android 15 there). Screen via scrcpy over ADB.
version: "1"
family: android
icon: android
guest_profile: android
readiness: adb
default_user: shell
supported_services: [adb]
min_resources: { vcpus: 2, ram_mb: 2048, storage_gb: 8 }
default_resources: { vcpus: 4, ram_mb: 4096, storage_gb: 16 }
license: false
arch: [arm64, x86_64]
images:
  android:
    url: docker://redroid/redroid:16.0.0_64only-latest
    format: container
params:
  android.backend: redroid
  redroid.width: "1080"
  redroid.height: "1920"
  redroid.dpi: "420"
  # The redroid 16 image allocates graphics buffers via ashmem even with use_memfd.
  redroid.requires_ashmem: "true"
