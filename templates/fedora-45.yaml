id: fedora-45
name: Fedora 45 Cloud
description: Official Fedora Cloud Base Generic image
version: "1"
family: linux
icon: fedora
guest_profile: cloud-init
readiness: ssh
default_user: tossbox
supported_services: [ssh, vnc, http, https]
min_resources: { vcpus: 1, ram_mb: 1024, storage_gb: 8 }
default_resources: { vcpus: 2, ram_mb: 2048, storage_gb: 20 }
license: false
arch: [x86_64]
images:
  libvirt:
    url: https://download.fedoraproject.org/pub/fedora/linux/releases/45/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-45-1.4.x86_64.qcow2
    format: qcow2
  docker-qemu:
    url: docker://qemux/qemu:latest
    format: container
params:
  os_variant: fedora-unknown
  # docker-qemu: cloud image booted by qemux/qemu (per-device copy mounted as /boot.<ext>, plus the cidata seed ISO).
  docker_qemu.boot_image: https://download.fedoraproject.org/pub/fedora/linux/releases/45/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-45-1.4.x86_64.qcow2
