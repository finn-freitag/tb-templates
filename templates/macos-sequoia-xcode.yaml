id: macos-sequoia-xcode
name: macOS Sequoia + Xcode
description: macOS VM (Tart image by Cirrus Labs) scheduled through Orchard. Max 2 VMs per Mac. Includes Xcode and iOS simulators.
version: "1"
family: macos
icon: apple
guest_profile: tart
readiness: ssh
default_user: admin
supported_services: [ssh, vnc]
min_resources: { vcpus: 4, ram_mb: 8192, storage_gb: 120 }
default_resources: { vcpus: 4, ram_mb: 16384, storage_gb: 150 }
license: false
arch: [arm64]
images:
  orchard:
    url: oci://ghcr.io/cirruslabs/macos-sequoia-xcode:latest
    format: oci
params:
  # Cirrus images ship with admin/admin; Orchard connects with these and the
  # agent's startup script sets the generated password after boot.
  orchard.image_username: admin
  orchard.image_password: admin
