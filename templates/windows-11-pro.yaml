id: windows-11-pro
name: Windows 11 Pro
description: Windows 11 Pro. libvirt uses a golden image from packer/windows; docker-qemu installs unattended via dockur/windows
version: "1"
family: windows
icon: windows
guest_profile: cloudbase-init
readiness: rdp
default_user: tossbox
supported_services: [rdp, ssh, vnc, http, https]
min_resources: { vcpus: 2, ram_mb: 4096, storage_gb: 64 }
default_resources: { vcpus: 4, ram_mb: 8192, storage_gb: 80 }
license: true
arch: [x86_64]
images:
  # Sysprepped golden image built with packer/windows (cloudbase-init, VirtIO,
  # OpenSSH, RDP+NLA). Must exist as <data_dir>/images/windows-11-pro.qcow2 on the node.
  libvirt:
    url: local:windows-11-pro.qcow2
    format: qcow2
  # dockur/windows installs Windows unattended from Microsoft's ISO on first
  # start (10-20 min). The agent sets USERNAME/PASSWORD from the device
  # credentials, VERSION from docker_qemu.version, KEY from the license and HOST from
  # the hostname. RDP is enabled by dockur; the ssh service adds OpenSSH via COMMAND.
  docker-qemu:
    url: docker://dockurr/windows:latest
    format: container
params:
  os_variant: win11
  tpm: "true"
  secure_boot: "true"
  docker_qemu.version: "11"
